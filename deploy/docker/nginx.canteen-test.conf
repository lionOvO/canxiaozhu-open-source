server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://canteen-backend-test:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /phone/assets/ {
        alias /usr/share/nginx/phone/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /phone/ {
        alias /usr/share/nginx/phone/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /phone/index.html {
        alias /usr/share/nginx/phone/index.html;
        add_header Cache-Control "no-cache";
    }

    location /phone/ {
        alias /usr/share/nginx/phone/;
        try_files $uri $uri/ /phone/index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        try_files /favicon.ico =204;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
